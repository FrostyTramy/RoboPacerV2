{% extends "run_base.html" %}

{% block config %}
  <div class="card" style="margin-bottom: 16px;">
    <div class="label">Model (.hef)</div>
    <div class="value" id="model-info">se verifica...</div>
    <div class="status-line" id="model-source" style="margin-bottom: 0;"></div>
    <div class="model-actions">
      <button type="button" class="btn small secondary" id="model-browse">Alege alt model</button>
      <button type="button" class="btn small secondary hidden" id="model-reset">Foloseste modelul din main</button>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="fs-modal">
    <div class="modal">
      <h2>Alege model (.hef)</h2>
      <div class="fs-path" id="fs-path"></div>
      <div class="fs-shortcuts">
        <button type="button" class="btn small secondary" data-go="home">Acasa</button>
        <button type="button" class="btn small secondary" data-go="main">Folderul main</button>
        <button type="button" class="btn small secondary" data-go="root">/ (radacina)</button>
      </div>
      <div class="fs-list" id="fs-list"></div>
      <div class="status-line error-text" id="fs-error"></div>
      <button type="button" class="btn small secondary" id="fs-cancel">Anuleaza</button>
    </div>
  </div>

  <h2>Mod viteza</h2>
  <div class="mode-switch" id="mode-switch">
    <button type="button" data-mode="cruise" class="active">Cruise</button>
    <button type="button" data-mode="controller">Controller</button>
    <button type="button" data-mode="none">Doar steering</button>
  </div>
  <div class="status-line" id="mode-help"></div>

  <div id="target-kmh-group" class="field-group">
    <label>
      Viteza tinta
      <span class="toggle-link" id="unit-toggle">(schimba in pace)</span>
    </label>
    <input type="text" id="target-kmh" value="8.0" inputmode="decimal">
  </div>

  <div class="field-group" id="distance-group">
    <label>Distanta tinta (m) - optional, gol = ruleaza pana la oprire</label>
    <input type="number" id="distance-m" min="{{ distance_min }}" max="{{ distance_max }}" step="1">
  </div>

  <div class="field-group checkbox">
    <input type="checkbox" id="raw-steering" checked>
    <label for="raw-steering">Steering brut (fara EMA/deadzone)</label>
  </div>

  <div class="field-group checkbox">
    <input type="checkbox" id="display">
    <label for="display">Fereastra preview (--display)</label>
  </div>
{% endblock %}

{% block live %}
  <h2>Telemetrie live</h2>
  <div class="grid">
    <div class="card"><div class="label">Angajat</div><div class="value" id="tm-engaged">--</div></div>
    <div class="card"><div class="label">Mod</div><div class="value" id="tm-mode">--</div></div>
    <div class="card"><div class="label">km/h</div><div class="value" id="tm-kmh">--</div></div>
    <div class="card"><div class="label">Tinta</div><div class="value" id="tm-target">--</div></div>
    <div class="card"><div class="label">PWM</div><div class="value" id="tm-pwm">--</div></div>
    <div class="card"><div class="label">Pace</div><div class="value" id="tm-pace">--</div></div>
    <div class="card"><div class="label">Distanta</div><div class="value" id="tm-distance">--</div></div>
  </div>
  <div class="status-line" id="tm-stop-reason"></div>
{% endblock %}

{% block page_script %}
<script>
  const TARGET_SPEED_MAX_KMH = {{ target_speed_max_kmh | tojson }};
  const DISTANCE_MIN = {{ distance_min | tojson }};
  const DISTANCE_MAX = {{ distance_max | tojson }};
  const MODE_HELP = {
    cruise: 'Model la volan, viteza fixa (media = tinta). D-pad inactiv. [A] porneste, [B] opreste.',
    controller: 'Model la volan, PWM direct (fara odometrie): [A] porneste de la neutru, apoi D-pad sus/jos = +/- 50 us pe apasare (max 1700). [B] opreste.',
    none: 'Doar steering-ul modelului - motorul ramane in neutru. [A] porneste, [B] opreste.',
  };

  // --- Model: the .hef in main/ unless one is picked in the file browser ---
  const MAIN_DIR = {{ main_dir | tojson }};
  let defaultModel = null;   // /api/main/model_info result
  let chosenHef = null;      // absolute path picked by the user, or null

  function baseName(path) { return path.slice(path.lastIndexOf('/') + 1); }
  function dirName(path) { return path.slice(0, path.lastIndexOf('/')) || '/'; }

  function renderModel() {
    const el = document.getElementById('model-info');
    const src = document.getElementById('model-source');
    document.getElementById('model-reset').classList.toggle('hidden', !chosenHef);
    if (chosenHef) {
      el.textContent = baseName(chosenHef);
      src.textContent = dirName(chosenHef);
      modelBlocked = false;
    } else if (defaultModel && defaultModel.ok) {
      el.textContent = defaultModel.model_name;
      src.textContent = 'din folderul main';
      modelBlocked = false;
    } else if (defaultModel) {
      el.innerHTML = `<span class="error-text">${escapeHtml(defaultModel.error)}</span>`;
      src.textContent = 'Alege un model cu butonul de mai jos.';
      modelBlocked = true;
    }
    refreshStartButton();
  }

  fetch('/api/main/model_info').then(r => r.json()).then(data => {
    defaultModel = data;
    renderModel();
  });
  document.getElementById('model-reset').addEventListener('click', () => { chosenHef = null; renderModel(); });

  // --- File browser window: pick any .hef on the Pi ------------------------
  const fsModal = document.getElementById('fs-modal');
  const fsListEl = document.getElementById('fs-list');
  const fsErrEl = document.getElementById('fs-error');
  let fsLastDir = null;

  function fsOpen(path) {
    fsErrEl.textContent = '';
    fetch('/api/fs/list' + (path ? '?path=' + encodeURIComponent(path) : '')).then(r => r.json()).then(d => {
      if (!d.ok) {
        fsErrEl.textContent = d.error === 'permission_denied' ? 'Fara acces la folderul asta.' : 'Nu pot deschide folderul.';
        return;
      }
      fsLastDir = d.path;
      document.getElementById('fs-path').textContent = d.path;
      fsListEl.innerHTML = '';
      const addItem = (text, meta, cls, onClick) => {
        const item = document.createElement('div');
        item.className = 'fs-item ' + cls;
        const name = document.createElement('span');
        name.textContent = text;
        item.appendChild(name);
        if (meta) {
          const m = document.createElement('span');
          m.className = 'meta';
          m.textContent = meta;
          item.appendChild(m);
        }
        item.addEventListener('click', onClick);
        fsListEl.appendChild(item);
      };
      if (d.parent) addItem('\u2191  ..  (folder parinte)', '', 'dir', () => fsOpen(d.parent));
      d.entries.forEach(e => {
        const full = (d.path === '/' ? '' : d.path) + '/' + e.name;
        if (e.type === 'dir') {
          addItem('\u25B8  ' + e.name, '', 'dir', () => fsOpen(full));
        } else {
          addItem(e.name, (e.size / 1048576).toFixed(1) + ' MB', 'hef', () => {
            chosenHef = full;
            fsModal.classList.add('hidden');
            renderModel();
          });
        }
      });
      if (!d.entries.length) fsListEl.insertAdjacentHTML('beforeend', '<div class="status-line">Niciun folder sau .hef aici.</div>');
      if (d.truncated) fsListEl.insertAdjacentHTML('beforeend', '<div class="status-line">Lista e taiata (prea multe intrari).</div>');
      fsListEl.scrollTop = 0;
    }).catch(() => { fsErrEl.textContent = 'Eroare de retea.'; });
  }

  document.getElementById('model-browse').addEventListener('click', () => {
    fsModal.classList.remove('hidden');
    fsOpen(fsLastDir || (chosenHef ? dirName(chosenHef) : null));
  });
  document.getElementById('fs-cancel').addEventListener('click', () => fsModal.classList.add('hidden'));
  fsModal.addEventListener('click', (e) => { if (e.target === fsModal) fsModal.classList.add('hidden'); });
  fsModal.querySelectorAll('[data-go]').forEach(btn => btn.addEventListener('click', () => {
    const go = btn.dataset.go;
    fsOpen(go === 'main' ? MAIN_DIR : go === 'root' ? '/' : null);
  }));

  // --- Mode switch + km/h<->pace toggle --------------------------------
  let currentMode = 'cruise';
  const modeButtons = document.querySelectorAll('#mode-switch button');
  function setMode(mode) {
    currentMode = mode;
    modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('target-kmh-group').classList.toggle('hidden', mode !== 'cruise');
    // Distance is measured by the speed sensor, which controller mode doesn't use.
    document.getElementById('distance-group').classList.toggle('hidden', mode === 'controller');
    document.getElementById('mode-help').textContent = MODE_HELP[mode];
  }
  modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
  setMode('cruise');

  let unitIsPace = false;
  function paceFromKmh(kmh) {
    if (!kmh || kmh <= 0) return '--:--';
    const totalSec = Math.round(3600 / kmh);
    return `${Math.floor(totalSec / 60)}:${(totalSec % 60).toString().padStart(2, '0')}`;
  }
  function kmhFromPace(paceStr) {
    const m = paceStr.trim().match(/^(\d+):(\d{1,2})$/);
    if (!m) return null;
    const totalMin = parseInt(m[1], 10) + parseInt(m[2], 10) / 60;
    return totalMin > 0 ? 60 / totalMin : null;
  }
  document.getElementById('unit-toggle').addEventListener('click', (e) => {
    const input = document.getElementById('target-kmh');
    if (!unitIsPace) {
      input.value = paceFromKmh(parseFloat(input.value.replace(',', '.')));
      e.target.textContent = '(schimba in km/h)';
    } else {
      input.value = (kmhFromPace(input.value) || 0).toFixed(1);
      e.target.textContent = '(schimba in pace)';
    }
    unitIsPace = !unitIsPace;
  });

  function buildParams() {
    let targetKmh = null;
    if (currentMode === 'cruise') {
      const input = document.getElementById('target-kmh');
      targetKmh = unitIsPace ? kmhFromPace(input.value) : parseFloat(input.value.replace(',', '.'));
      if (!Number.isFinite(targetKmh) || targetKmh < 0.1 || targetKmh > TARGET_SPEED_MAX_KMH) {
        throw new Error(`Viteza tinta invalida (0.1 - ${TARGET_SPEED_MAX_KMH} km/h).`);
      }
    }
    const distanceRaw = currentMode === 'controller' ? '' : document.getElementById('distance-m').value;
    let distanceM = null;
    if (distanceRaw !== '') {
      distanceM = parseFloat(distanceRaw);
      if (!Number.isFinite(distanceM) || distanceM < DISTANCE_MIN || distanceM > DISTANCE_MAX) {
        throw new Error(`Distanta invalida (${DISTANCE_MIN} - ${DISTANCE_MAX} m).`);
      }
    }
    return {
      speed_mode: currentMode,
      target_kmh: targetKmh,
      distance_m: distanceM,
      raw_steering: document.getElementById('raw-steering').checked,
      display: document.getElementById('display').checked,
      hef_path: chosenHef,
    };
  }

  // --- Telemetry (main.py's control socket, only while it runs) ---------
  function pollLive() {
    fetch('/api/main/status').then(r => r.json()).then(t => {
      document.getElementById('tm-engaged').innerHTML = t.engaged
        ? '<span class="badge ok">DA</span>' : '<span class="badge muted">nu</span>';
      document.getElementById('tm-mode').textContent = t.speed_mode || '--';
      document.getElementById('tm-kmh').textContent = t.kmh != null ? t.kmh.toFixed(2) : '--';
      document.getElementById('tm-target').textContent = t.effective_target_kmh != null && t.speed_mode === 'cruise'
        ? t.effective_target_kmh.toFixed(1) + ' km/h' : '--';
      document.getElementById('tm-pwm').textContent = t.pwm_us != null ? t.pwm_us.toFixed(0) + ' us' : '--';
      document.getElementById('tm-pace').textContent = t.pace_sec_per_km
        ? paceFromKmh(3600 / t.pace_sec_per_km) + '/km' : '--:--';
      document.getElementById('tm-distance').textContent = t.distance_m != null
        ? `${t.distance_m.toFixed(0)}${t.distance_target_m != null ? ' / ' + t.distance_target_m.toFixed(0) : ''}m`
        : '--';
      document.getElementById('tm-stop-reason').textContent = t.stop_reason ? `Motiv oprire: ${t.stop_reason}` : '';
    });
  }
</script>
{% endblock %}

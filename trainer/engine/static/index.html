<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoboPacerV2 Trainer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="standard" data-action="full">

<header>
  <h1>RoboPacerV2 Trainer</h1>
  <div class="toggle-group" id="mode-toggle">
    <button data-mode-btn="standard" class="active">Standard</button>
    <button data-mode-btn="custom">Custom</button>
  </div>
</header>

<div class="prereq-banner checking" id="prereq-banner">Checking Docker...</div>

<nav class="action-tabs" id="action-tabs">
  <button data-action-btn="full" class="active">Full (Train + Compile)</button>
  <button data-action-btn="train-only">Train only</button>
  <button data-action-btn="compile-only">Compile only</button>
</nav>

<main>

  <!-- ───────────────────────── Full ───────────────────────── -->
  <section data-action="full" class="action-panel active">
    <div class="field">
      <label>Dataset folder (driving_log.json)</label>
      <div class="path-row">
        <input type="text" id="full_json_path" data-field="json_path" data-validate-kind="dataset" placeholder="D:\...\PistaAtletism">
        <button type="button" data-browse="full_json_path" data-browse-type="folder">Browse...</button>
      </div>
      <span class="validate-result"></span>
    </div>
    <div class="field">
      <label>Output model name</label>
      <input type="text" id="full_model_name" data-field="model_name" placeholder="model">
    </div>
    <div class="field">
      <label>Epochs</label>
      <input type="number" id="full_epochs" data-field="epochs" min="1" step="1">
    </div>
    <div class="field">
      <label>Batch size</label>
      <input type="number" id="full_batch_size" data-field="batch_size" min="1" step="1">
    </div>

    <fieldset class="advanced-field">
      <legend>Advanced</legend>
      <div class="field-grid">
        <div class="field"><label>Learning rate</label><input type="number" data-field="learning_rate" step="0.00001"></div>
        <div class="field"><label>Weight decay</label><input type="number" data-field="weight_decay" step="0.00001"></div>
        <div class="field"><label>Frame stack size</label><input type="number" data-field="frame_stack_n" step="1" min="1"></div>
        <div class="field"><label>Train split</label><input type="number" data-field="train_split" step="0.01"></div>
        <div class="field"><label>Val split</label><input type="number" data-field="val_split" step="0.01"></div>
        <div class="field"><label>Split block (timestamped, s)</label><input type="number" data-field="split_block_seconds" step="0.1"></div>
        <div class="field"><label>Split block (classic, frames)</label><input type="number" data-field="classic_split_block_frames" step="1"></div>
        <div class="field"><label>Calibration sample count</label><input type="number" data-field="calib_n" step="1"></div>
        <div class="field"><label>Random seed</label><input type="number" data-field="seed" step="1"></div>
        <div class="field"><label>Horizontal flip prob</label><input type="number" data-field="flip_prob" step="0.01"></div>
        <div class="field"><label>Brightness min</label><input type="number" data-field="brightness_min" step="0.01"></div>
        <div class="field"><label>Brightness max</label><input type="number" data-field="brightness_max" step="0.01"></div>
        <div class="field"><label>DataLoader workers</label><input type="number" data-field="num_workers" step="1" min="0"></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="use_ram_cache"> RAM frame cache</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="use_torch_compile"> torch.compile</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="use_amp"> BF16 autocast</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="drop_last"> Drop last batch</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="pin_memory"> Pinned/non-blocking transfers</label></div>
      </div>
      <p class="hint">These six throughput toggles are what train_a100.sh bundles automatically via <code>--a100</code>. On Windows CPU, leave them off.</p>
    </fieldset>

    <div class="actions">
      <button class="start-btn primary" id="full_start">Start Full Training + Compile</button>
      <button class="start-btn secondary" id="full_retry_compile">Retry compile</button>
      <button class="start-btn secondary" id="full_smoketest">Smoke test (with dataset)</button>
    </div>
  </section>

  <!-- ───────────────────────── Train-only ───────────────────────── -->
  <section data-action="train-only" class="action-panel">
    <div class="field">
      <label>Dataset folder (driving_log.json)</label>
      <div class="path-row">
        <input type="text" id="trainonly_json_path" data-field="json_path" data-validate-kind="dataset" placeholder="D:\...\PistaAtletism">
        <button type="button" data-browse="trainonly_json_path" data-browse-type="folder">Browse...</button>
      </div>
      <span class="validate-result"></span>
    </div>
    <div class="field">
      <label>Output model name</label>
      <input type="text" id="trainonly_model_name" data-field="model_name" placeholder="model">
    </div>
    <div class="field">
      <label>Epochs</label>
      <input type="number" id="trainonly_epochs" data-field="epochs" min="1" step="1">
    </div>
    <div class="field">
      <label>Batch size</label>
      <input type="number" id="trainonly_batch_size" data-field="batch_size" min="1" step="1">
    </div>

    <fieldset class="advanced-field">
      <legend>Advanced</legend>
      <div class="field-grid">
        <div class="field"><label>Learning rate</label><input type="number" data-field="learning_rate" step="0.00001"></div>
        <div class="field"><label>Weight decay</label><input type="number" data-field="weight_decay" step="0.00001"></div>
        <div class="field"><label>Frame stack size</label><input type="number" data-field="frame_stack_n" step="1" min="1"></div>
        <div class="field"><label>Train split</label><input type="number" data-field="train_split" step="0.01"></div>
        <div class="field"><label>Val split</label><input type="number" data-field="val_split" step="0.01"></div>
        <div class="field"><label>Split block (timestamped, s)</label><input type="number" data-field="split_block_seconds" step="0.1"></div>
        <div class="field"><label>Split block (classic, frames)</label><input type="number" data-field="classic_split_block_frames" step="1"></div>
        <div class="field"><label>Calibration sample count</label><input type="number" data-field="calib_n" step="1"></div>
        <div class="field"><label>Random seed</label><input type="number" data-field="seed" step="1"></div>
        <div class="field"><label>Horizontal flip prob</label><input type="number" data-field="flip_prob" step="0.01"></div>
        <div class="field"><label>Brightness min</label><input type="number" data-field="brightness_min" step="0.01"></div>
        <div class="field"><label>Brightness max</label><input type="number" data-field="brightness_max" step="0.01"></div>
        <div class="field"><label>DataLoader workers</label><input type="number" data-field="num_workers" step="1" min="0"></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="use_ram_cache"> RAM frame cache</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="use_torch_compile"> torch.compile</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="use_amp"> BF16 autocast</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="drop_last"> Drop last batch</label></div>
        <div class="field checkbox-field"><label><input type="checkbox" data-field="pin_memory"> Pinned/non-blocking transfers</label></div>
      </div>
    </fieldset>

    <div class="actions">
      <button class="start-btn primary" id="trainonly_start">Start Training</button>
    </div>
  </section>

  <!-- ───────────────────────── Compile-only ───────────────────────── -->
  <section data-action="compile-only" class="action-panel">
    <div class="field">
      <label>Checkpoint (.pth)</label>
      <div class="path-row">
        <input type="text" id="compileonly_pth_path" data-field="pth_path" data-validate-kind="pth" placeholder="D:\...\models\model.pth">
        <button type="button" data-browse="compileonly_pth_path" data-browse-type="file" data-file-type="pth">Browse...</button>
      </div>
      <span class="validate-result"></span>
    </div>
    <div class="field">
      <label>Calibration data (.npy) - saved by training next to the .pth</label>
      <div class="path-row">
        <input type="text" id="compileonly_calib_npy" data-field="calib_npy" data-validate-kind="npy" placeholder="D:\...\models\model_calib_data_nhwc.npy">
        <button type="button" data-browse="compileonly_calib_npy" data-browse-type="file" data-file-type="npy">Browse...</button>
      </div>
      <span class="validate-result"></span>
    </div>
    <div class="field">
      <label>Output model name</label>
      <input type="text" id="compileonly_model_name" data-field="model_name" placeholder="model">
    </div>

    <div class="actions">
      <button class="start-btn primary" id="compileonly_start">Compile</button>
      <button class="start-btn secondary" id="compileonly_smoketest">Test compile (no dataset)</button>
    </div>
  </section>

</main>

<div class="status-bar">
  <span id="status-text">Idle</span>
  <span id="status-elapsed"></span>
  <span id="status-loss"></span>
  <span id="status-models"></span>
  <button id="stop-btn" disabled>Stop</button>
</div>

<pre id="log"></pre>

<script src="app.js"></script>
</body>
</html>

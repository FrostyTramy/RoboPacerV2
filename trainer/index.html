<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoboPacerV2 Trainer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; color: #0c8; margin-bottom: 16px; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 640px; }
  label { display: block; font-size: 13px; color: #aaa; margin: 10px 0 4px; }
  input[type=text], input[type=number] {
    width: 100%; box-sizing: border-box; background: #0c0c0c;
    border: 1px solid #333; color: #eee; padding: 8px; border-radius: 4px; font-size: 14px;
  }
  .browse-row { display: flex; gap: 8px; align-items: flex-end; }
  .browse-row input { flex: 1; }
  .browse-btn { padding: 8px 14px; background: #2a2a2a; border: 1px solid #444; color: #ccc;
                border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  .browse-btn:hover { background: #333; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button { margin-top: 14px; padding: 10px 18px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-green  { background: #0c8; color: #000; font-weight: 600; }
  .btn-red    { background: #833; color: #fff; margin-left: 8px; }
  .btn-gray   { background: #2a2a2a; color: #ccc; border: 1px solid #444; margin-left: 8px; }
  .btn-blue   { background: #0af; color: #000; font-weight: 600; }
  .btn-orange { background: #f80; color: #000; margin-left: 8px; }
  #log { background: #000; border: 1px solid #333; border-radius: 4px; padding: 10px; height: 320px;
         overflow-y: auto; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  .info { color: #8cf; } .success { color: #0c8; } .error { color: #f66; } .warning { color: #fc6; } .docker { color: #777; }
  #progress { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 10px; }
  #progressBar { height: 100%; width: 0%; background: #0c8; transition: width 0.2s; }

  /* Toggle switch */
  .toggle-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; max-width: 640px; }
  .toggle-label { font-size: 14px; color: #aaa; }
  .toggle-label.active { color: #0c8; font-weight: 600; }
  .switch { position: relative; display: inline-block; width: 52px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #0c8; border-radius: 26px; transition: .3s; }
  .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
                   background: #000; border-radius: 50%; transition: .3s; }
  input:checked + .slider { background: #0af; }
  input:checked + .slider:before { transform: translateX(26px); }

  .mode-panel { display: none; }
  .mode-panel.visible { display: block; }
</style>
</head>
<body>
<h1>RoboPacerV2 Trainer</h1>

<!-- Toggle switch -->
<div class="toggle-wrap">
  <span class="toggle-label" id="labelLeft">Antrenament complet</span>
  <label class="switch">
    <input type="checkbox" id="modeSwitch" onchange="switchMode()">
    <span class="slider"></span>
  </label>
  <span class="toggle-label" id="labelRight">Compilare din PTH</span>
</div>

<!-- ═══════════════ STANGA: Antrenament complet ═══════════════ -->
<div class="card mode-panel visible" id="panelTrain">
  <div class="browse-row">
    <div style="flex:1">
      <label>Dataset folder sau driving_log.json</label>
      <input id="jsonPath" placeholder="D:\RoboPacerV2\set1">
    </div>
    <button class="browse-btn" onclick="browseFolder('jsonPath')" style="margin-top:22px">📁 Browse</button>
  </div>

  <div class="row">
    <div>
      <label>Model name</label>
      <input id="modelName" value="model">
    </div>
    <div>
      <label>Epochs</label>
      <input id="epochs" type="number" value="20">
    </div>
    <div>
      <label>Batch size</label>
      <input id="batchSize" type="number" value="32">
    </div>
  </div>

  <div>
    <button class="btn-green" id="startBtn" onclick="startTraining()">▶ Start Training</button>
    <button class="btn-red"   id="stopBtn"  onclick="stopTraining()" disabled>■ Stop</button>
    <button class="btn-gray"  id="compileBtn" onclick="compileOnly()" title="Recompileaza HEF din .onnx existent - fara reantrenare.">↺ Retry compile</button>
    <button class="btn-gray"  id="smoketestBtn" onclick="smokeTest()" title="0 epoch - testeaza doar export+Docker+compile.">⚡ Test export</button>
  </div>
  <div id="progress"><div id="progressBar"></div></div>
</div>

<!-- ═══════════════ DREAPTA: Compilare din PTH ═══════════════ -->
<div class="card mode-panel" id="panelPth">
  <div class="browse-row">
    <div style="flex:1">
      <label>Fisier PTH (checkpoint PyTorch)</label>
      <input id="pthPath" placeholder="D:\RoboPacerV2\trainer\models\model.pth">
    </div>
    <button class="browse-btn" onclick="browseFile('pthPath','pth')" style="margin-top:22px">📁 Browse</button>
  </div>

  <div class="browse-row">
    <div style="flex:1">
      <label>Date calibrare .npy (optional — sintetic daca lipseste)</label>
      <input id="calibPath" placeholder="optional">
    </div>
    <button class="browse-btn" onclick="browseFile('calibPath','npy')" style="margin-top:22px">📁 Browse</button>
  </div>

  <div>
    <label>Nume output HEF</label>
    <input id="pthModelName" value="model_cloud">
  </div>

  <div>
    <button class="btn-blue"   id="compilePthBtn"  onclick="compilePth()">▶ Compileaza din PTH</button>
    <button class="btn-orange" id="smoketestPthBtn" onclick="smoketestPth()" title="Compileaza un model gol pentru a verifica ca Docker+Hailo merge.">⚡ Test compile</button>
    <button class="btn-red"    id="stopBtn2" onclick="stopTraining()" disabled>■ Stop</button>
  </div>
</div>

<!-- Terminal comun -->
<div class="card">
  <div id="log"></div>
</div>

<script>
const logEl = document.getElementById("log");
const progressBar = document.getElementById("progressBar");

// ── Mode switch ──────────────────────────────────────────────
function switchMode() {
  const isPth = document.getElementById("modeSwitch").checked;
  document.getElementById("panelTrain").classList.toggle("visible", !isPth);
  document.getElementById("panelPth").classList.toggle("visible", isPth);
  document.getElementById("labelLeft").classList.toggle("active", !isPth);
  document.getElementById("labelRight").classList.toggle("active", isPth);
}
// Init
document.getElementById("labelLeft").classList.add("active");

// ── Browse helpers ───────────────────────────────────────────
async function browseFolder(inputId) {
  const r = await fetch("/api/browse/folder");
  const d = await r.json();
  if (d.path) document.getElementById(inputId).value = d.path;
}
async function browseFile(inputId, type) {
  const r = await fetch("/api/browse/file?type=" + type);
  const d = await r.json();
  if (d.path) document.getElementById(inputId).value = d.path;
}

// ── Log ─────────────────────────────────────────────────────
function logLine(text, level) {
  const div = document.createElement("div");
  div.className = level || "";
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// ── Button state ─────────────────────────────────────────────
const trainBtns  = ["startBtn","compileBtn","smoketestBtn"];
const pthBtns    = ["compilePthBtn","smoketestPthBtn"];

async function refreshStatus() {
  const r = await fetch("/api/status");
  const data = await r.json();
  const running = data.running;
  [...trainBtns, ...pthBtns].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = running;
  });
  document.getElementById("stopBtn").disabled   = !running;
  document.getElementById("stopBtn2").disabled  = !running;
}

function attachStream() {
  [...trainBtns, ...pthBtns].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = true;
  });
  document.getElementById("stopBtn").disabled  = false;
  document.getElementById("stopBtn2").disabled = false;

  const stream = new EventSource("/api/stream");
  stream.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "log") {
      logLine(ev.text, ev.level);
    } else if (ev.type === "split") {
      logLine(`Dataset: ${ev.total} total -> train=${ev.train} val=${ev.val}`, "info");
    } else if (ev.type === "epoch") {
      progressBar.style.width = (100 * ev.epoch / ev.total) + "%";
      logLine(`Epoch ${ev.epoch}/${ev.total}  train=${ev.train}  val=${ev.val}${ev.best ? "  (best)" : ""}`, "success");
    } else if (ev.type === "file") {
      logLine(`Salvat: models/${ev.name}`, "success");
    } else if (ev.type === "done") {
      logLine("Gata.", "success");
      progressBar.style.width = "100%";
      stream.close();
      refreshStatus();
    }
  };
  stream.onerror = () => { stream.close(); refreshStatus(); };
}

// ── Antrenament complet ──────────────────────────────────────
async function startTraining() {
  const config = {
    json_path:  document.getElementById("jsonPath").value.trim(),
    model_name: document.getElementById("modelName").value.trim() || "model",
    epochs:     parseInt(document.getElementById("epochs").value, 10) || 20,
    batch_size: parseInt(document.getElementById("batchSize").value, 10) || 32,
  };
  if (!config.json_path) { alert("Seteaza folderul cu dataset mai intai."); return; }
  logEl.innerHTML = ""; progressBar.style.width = "0%";
  const res = await fetch("/api/train", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(config) });
  if (!res.ok) { logLine("Eroare: " + (await res.json()).error, "error"); return; }
  attachStream();
}

async function compileOnly() {
  const config = {
    model_name: document.getElementById("modelName").value.trim() || "model",
    json_path:  document.getElementById("jsonPath").value.trim(),
  };
  logEl.innerHTML = ""; progressBar.style.width = "0%";
  logLine(`Recompileaza ${config.model_name} din .onnx existent...`, "info");
  const res = await fetch("/api/compile", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(config) });
  if (!res.ok) { logLine("Eroare: " + (await res.json()).error, "error"); return; }
  attachStream();
}

async function smokeTest() {
  const config = { json_path: document.getElementById("jsonPath").value.trim() };
  if (!config.json_path) { alert("Seteaza folderul cu dataset mai intai."); return; }
  logEl.innerHTML = ""; progressBar.style.width = "0%";
  logLine("Test 0-epoch: verific export+Docker+compile...", "info");
  const res = await fetch("/api/smoketest", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(config) });
  if (!res.ok) { logLine("Eroare: " + (await res.json()).error, "error"); return; }
  attachStream();
}

// ── Compilare din PTH ────────────────────────────────────────
async function compilePth() {
  const config = {
    pth_path:   document.getElementById("pthPath").value.trim(),
    model_name: document.getElementById("pthModelName").value.trim() || "model_cloud",
    calib_npy:  document.getElementById("calibPath").value.trim(),
  };
  if (!config.pth_path) { alert("Selecteaza fisierul PTH mai intai."); return; }
  logEl.innerHTML = ""; progressBar.style.width = "0%";
  logLine(`Compilare din PTH: ${config.pth_path}`, "info");
  const res = await fetch("/api/compile_pth", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(config) });
  if (!res.ok) { logLine("Eroare: " + (await res.json()).error, "error"); return; }
  attachStream();
}

async function smoketestPth() {
  logEl.innerHTML = ""; progressBar.style.width = "0%";
  logLine("Test compile (model gol, fara dataset)...", "info");
  const res = await fetch("/api/smoketest_pth", { method: "POST" });
  if (!res.ok) { logLine("Eroare: " + (await res.json()).error, "error"); return; }
  attachStream();
}

async function stopTraining() {
  await fetch("/api/stop", { method: "POST" });
  logLine("Stop solicitat.", "warning");
}

refreshStatus();
</script>
</body>
</html>

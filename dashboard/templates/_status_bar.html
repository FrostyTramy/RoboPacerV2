<!--
  Shared on every page: battery, relay switch, which script is running + Stop.
  Fed by /api/stream/status (1s). A page can define onStatus(payload) to
  react to the same data (stats cards, hiding its Start form, ...).

  The Releu card is one big switch: tap = toggle. OFF cuts motor power and
  stops the running script. ON is only accepted with nothing running - and a
  Start that finds the relay already ON power-cycles it first (see /api/relay
  and /api/start).
-->
<div class="status-bar" id="status-bar">
  <div class="grid status-cards">
    <div class="card" id="sb-battery-card">
      <div class="label">Baterie</div>
      <div class="value" id="sb-battery">--</div>
      <div class="battery-bar"><span id="sb-battery-fill"></span></div>
    </div>
    <button type="button" class="card relay-card unavailable" id="sb-relay-card" disabled>
      <div class="label">Releu</div>
      <span class="switch"><span class="knob"></span></span>
    </button>
  </div>
  <div class="status-bar-row">
    <span class="label">Script</span>
    <span id="sb-running">--</span>
    <button class="btn small danger hidden" id="sb-stop">Stop</button>
  </div>
  <div class="status-line error-text" id="sb-error"></div>
</div>

<script>
  // SSIDs, device names, script output come from outside - never put them
  // into innerHTML raw (a nearby AP can name itself "<img onerror=...>").
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  (function () {
    const batteryCard = document.getElementById('sb-battery-card');
    const batteryEl = document.getElementById('sb-battery');
    const batteryFill = document.getElementById('sb-battery-fill');
    const relayCard = document.getElementById('sb-relay-card');
    const runningEl = document.getElementById('sb-running');
    const stopBtn = document.getElementById('sb-stop');
    const errEl = document.getElementById('sb-error');

    const RELAY_ERRORS = {
      script_running: 'Un script ruleaza - releul e condus de script.',
      esp32_unavailable: 'ESP32 deconectat.',
    };

    let relayOn = null;   // null = unknown / unavailable
    let busy = false;

    function renderBattery(b) {
      const level = b ? b.level : 'none';
      batteryCard.dataset.level = level;
      if (!b || b.percent == null) {
        batteryEl.textContent = b ? b.voltage_v.toFixed(1) + ' V' : '--';
        batteryFill.style.width = '0%';
        return;
      }
      batteryEl.textContent = `${b.voltage_v.toFixed(1)} V · ${b.percent}%`;
      batteryFill.style.width = b.percent + '%';
    }

    function render(payload) {
      const stats = payload.stats || {};
      const esp32 = stats.esp32 || {};
      renderBattery(stats.battery);

      const available = !!esp32.service_running && !!esp32.esp32_connected;
      relayOn = available ? !!esp32.relay_on : null;
      relayCard.classList.toggle('unavailable', !available);
      relayCard.classList.toggle('on', relayOn === true);
      relayCard.disabled = !available || busy;
      relayCard.title = !available
        ? (esp32.service_running ? 'ESP32 deconectat' : 'estop_listener oprit') : '';

      const running = payload.running;
      stopBtn.classList.toggle('hidden', !running);
      if (running) {
        const up = running.uptime_seconds != null ? running.uptime_seconds.toFixed(0) + 's' : '?';
        const fps = running.fps != null ? ` <span class="badge muted">${running.fps.toFixed(1)} FPS</span>` : '';
        runningEl.innerHTML = `<span class="badge ok">${escapeHtml(running.name)}</span>${fps} ` +
          `<span class="muted-text">PID ${running.pid}, ${up}` +
          `${running.external ? ', pornit din afara dashboard-ului' : ''}</span>`;
      } else {
        runningEl.innerHTML = '<span class="muted-text">niciunul</span>';
      }
      if (typeof onStatus === 'function') onStatus(payload);
    }

    function post(url, body) {
      errEl.textContent = '';
      return fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      }).then(r => r.json()).then(data => {
        if (!data.ok) errEl.textContent = 'Eroare: ' + (RELAY_ERRORS[data.error] || data.error || 'necunoscuta');
      }).catch(() => { errEl.textContent = 'Eroare de retea.'; });
    }

    // Tap the card: ON -> OFF (cuts power, stops the script), OFF -> ON.
    relayCard.addEventListener('click', () => {
      if (relayOn === null || busy) return;
      busy = true;
      relayCard.disabled = true;
      relayCard.classList.add('busy');
      post('/api/relay', { on: !relayOn }).finally(() => {
        busy = false;
        relayCard.classList.remove('busy');
      });
    });
    stopBtn.addEventListener('click', () => {
      stopBtn.disabled = true;
      post('/api/stop').finally(() => { stopBtn.disabled = false; });
    });

    let stream = null;
    function open() {
      if (stream || document.hidden) return;
      stream = new EventSource('/api/stream/status');
      stream.onmessage = (e) => render(JSON.parse(e.data));
    }
    function close() {
      if (stream) { stream.close(); stream = null; }
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) close(); else open(); });
    open();
  })();
</script>
